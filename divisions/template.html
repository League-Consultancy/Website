<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RWZGRCFBS7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-RWZGRCFBS7');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division | League Consultancy</title>
    <meta name="description" content="Technical division engineering solutions at League Consultancy.">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" type="image/svg" href="../assets/logos/League_Logo.svg">
</head>

<body data-theme="home">

    <header></header>

    <main>
        <!-- Division Hero -->
        <section class="portal-section division-hero">
            <div class="portal-content">
                <p class="text-mono text-accent" id="hero-accent">Loading...</p>
                <h1 id="hero-title">...</h1>
                <p id="hero-description">...</p>
            </div>
            <div class="portal-image" id="hero-image"></div>
        </section>

        <!-- Capabilities Grid -->
        <section class="section-padding">
            <div class="container">
                <h2 class="text-accent text-mono" style="margin-bottom: var(--space-lg);">Core Capabilities</h2>
                <div class="grid grid-3" id="capabilities-container">
                    <!-- Capabilities will be injected here -->
                </div>
            </div>
        </section>

        <!-- Works Done / Portfolio -->
        <section class="section-padding bg-surface">
            <div class="container">
                <h2 class="text-accent text-mono" style="margin-bottom: var(--space-lg);">Works Done</h2>
                <div class="grid grid-2" id="projects-container">
                    <!-- Projects will be injected here -->
                </div>
            </div>
        </section>

        <!-- CTA -->
        <section class="section-padding" style="text-align: center;">
            <div class="container" id="cta-container">
                <h2 id="cta-title">Ready to collaborate?</h2>
                <p style="margin: var(--space-md) 0;" id="cta-description">Get in touch with our experts.</p>
                <a href="mailto:info@leagueconsultancy.com" class="btn" id="cta-button">Inquire Now</a>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/main.js"></script>

    <script>
        $(function () {
            // Get division ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const divId = urlParams.get('id');

            if (!divId) {
                $('#hero-title').text('Division Not Found');
                $('#hero-accent').text('Error');
                return;
            }

            // Load Division Data
            $.getJSON(`data/${divId}.json`, function (data) {
                // Set Theme
                $('body').attr('data-theme', data.theme || divId);

                // Set Title & Meta
                document.title = `${data.name} | League Consultancy`;
                $('meta[name="description"]').attr('content', data.hero.description || '');

                // Populate Hero
                $('#hero-accent').text(data.hero.accentText);
                $('#hero-title').text(data.hero.title);
                $('#hero-description').text(data.hero.description);
                if (data.hero.image) {
                    $('#hero-image').css({
                        'background-image': `url('${data.hero.image}')`,
                        'background-size': 'cover',
                        'background-position': 'center'
                    });
                } else {
                    $('#hero-image').hide();
                }

                // Populate Capabilities
                let capabilitiesHtml = '';
                data.capabilities.forEach(cap => {
                    let iconHtml = cap.icon ? `<img src="${cap.icon}" style="height: 32px; width: auto;" alt="">` : '';
                    capabilitiesHtml += `
                        <div class="capability-card reveal-on-scroll">
                            <div class="capability-card-header">
                                ${iconHtml}
                                <h3 class="capability-card-title">${cap.title}</h3>
                            </div>
                            <p class="capability-card-desc">${cap.description}</p>
                        </div>`;
                });
                $('#capabilities-container').html(capabilitiesHtml);

                // Populate Projects
                let projectsHtml = '';
                if (data.projects && data.projects.length > 0) {
                    data.projects.forEach(proj => {
                        projectsHtml += `
                            <div class="project-card reveal-on-scroll">
                                <div style="height: 250px; background-image: url('${proj.image}'); background-size: cover; background-position: center;">
                                </div>
                                <div style="padding: var(--space-md);">
                                    <p class="text-mono text-accent" style="font-size: 0.8rem;">${proj.id}</p>
                                    <h3>${proj.title}</h3>
                                    <p style="margin-top: var(--space-sm); font-size: 0.9rem;">${proj.description}</p>
                                    <!-- <a href="${proj.link}" class="btn" style="margin-top: var(--space-sm); font-size: 0.8rem; padding: 0.5rem 1.2rem;">View Details</a> -->
                                </div>
                            </div>`;
                    });
                } else {
                    projectsHtml = '<p style="grid-column: span 2; text-align: center; opacity: 0.6;">No case studies available for this division yet.</p>';
                }
                $('#projects-container').html(projectsHtml);

                // Trigger Scroll Reveal Observer
                if (typeof window.applyScrollReveal === 'function') {
                    window.applyScrollReveal();
                }
            }).fail(function () {
                $('#hero-title').text('Error Loading Division');
                $('#hero-accent').text('Error');
            });
        });
    </script>
</body>

</html>
